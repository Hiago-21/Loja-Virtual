<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resumo do carrinho com itens selecionados, descontos e total da compra em uma visão simples.">
  <title>Carrinho | GameGrid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="GameGrid home">
        <img class="brand-logo" src="GameGridClaro.png" alt="GameGrid" width="290" height="120">
      </a>
      <nav class="nav-links" aria-label="Navegacao principal">
        <a href="index.html">Loja</a>
        <a href="como-fiz.html">Como fiz</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Alternar tema">☼</button>
        <a class="cart-link" href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="page-shell content-narrow">
    <a class="back-link" href="index.html">← Continuar comprando</a>
    <h1>Seu carrinho.</h1>

    <div class="cart-list" id="cart-list"></div>

    <div class="cart-summary">
      <div>
        <span>Subtotal</span>
        <span id="cart-subtotal">R$ 0,00</span>
      </div>
      <div>
        <span>Desconto</span>
        <span id="cart-discount">R$ 0,00</span>
      </div>
      <p id="discount-message">Adicione 2 jogos e ganhe 10% de desconto.</p>
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">R$ 0,00</span>
      </div>
    </div>

    <a class="cta" id="checkout-link" href="checkout.html" style="margin-top: 22px;">Ir para Pagamento</a>

    <section class="recommendations" id="recommendations" hidden>
      <div class="section-heading">
        <h2>Você também pode gostar</h2>
        <span>Seleção baseada no seu carrinho</span>
      </div>
      <div class="recommendation-grid" id="recommendation-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>GameGrid</span>
      <span>Seu carrinho</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
